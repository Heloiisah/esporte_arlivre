<section id="form">
    <h2> Cadastro de Atleta </h2>

    <form id="form-atleta" (submit)="enviarDadosAtleta()">
        <label for="nome">Nome Completo*</label>
        <input type="text" name="nome" id="nome" [(ngModel)] = "nome" class="input01" maxlength="60" required placeholder="Digite o nome Completo">

        <label for="cpf">CPF*</label>
        <input type="text" name="cpf" [(ngModel)] = "cpf" id="cpf" class="input02" maxlength="14" required placeholder="Digite o cpf">

        <label for="sexo">Sexo</label>
        <input type="radio" name="sexo" [(ngModel)] = "sexo" id="sexoM" class="radio01" required value="M"> Masculino
        <input type="radio" name="sexo" [(ngModel)] = "sexo" id="sexoF" class="radio01" required value="F"> Feminino
        <input type="radio" name="sexo" [(ngModel)] = "sexo" id="sexoN" class="radio01" required value="N"> Não Declarar

        <label for="cep">CEP*</label>
        <input type="text" name="cep" [(ngModel)] = "cep" id="cep" class="input02" maxlength="9" required placeholder="Digite o cep">

        <label for="rua-logradouro">Rua/Logradouro*</label>
        <input type="text" name="rua-logradouro" [(ngModel)] = "ruaLogradouro" id="rua-logradouro" class="input01" maxlength="100" required placeholder="Digite a Rua ou o Logradouro">

        <label for="bairro">Bairro*</label>
        <input type="text" name="bairro" [(ngModel)] = "bairro" id="bairro" class="input02" maxlength="60" required placeholder="Digite o bairro ">

        <label for="cidade">Cidade*</label>
        <input type="text" name="cidade" [(ngModel)] = "cidade" id="cidade" class="input02" maxlength="60" required placeholder="Digite o cidade ">

        <label for="uf">UF*</label>
        <input type="text" name="uf" [(ngModel)] = "uf" id="uf" class="input02" maxlength="60" required placeholder="Digite a UF ">

        <div id="div-btns">
            <button type="submit" id="btnAdd"> Cadastrar </button>
            <button type="reset" id="btnLimpar"> Limpar </button>
        </div>

    </form>
</section>
