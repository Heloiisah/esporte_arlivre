
<section id="form">

    <h2>Cadastro de Atleta</h2>

    <form id="form-atleta">

        <label for="nome">
            Nome Completo*
        </label>

        <input
            type="text"
            id="nome"
            name="nome"
            class="input01"
            maxlength="60"
            required
            [(ngModel)]="atleta.nome"
            placeholder="Digite o nome completo"
        >

        <label for="cpf">
            CPF*
        </label>

        <input
            type="text"
            id="cpf"
            name="cpf"
            class="input02"
            maxlength="14"
            required
            [(ngModel)]="atleta.cpf"
            (input)="formatarCPF()"
            placeholder="000.000.000-00"
        >

        <label>
            Sexo
        </label>

        <input
            type="radio"
            name="sexo"
            id="sexoM"
            class="radio01"
            value="M"
            required
            [(ngModel)]="atleta.sexo"
        >
        Masculino

        <input
            type="radio"
            name="sexo"
            id="sexoF"
            class="radio01"
            value="F"
            required
            [(ngModel)]="atleta.sexo"
        >
        Feminino

        <input
            type="radio"
            name="sexo"
            id="sexoN"
            class="radio01"
            value="N"
            required
            [(ngModel)]="atleta.sexo"
        >
        Não Declarar

        <label for="cep">
            CEP*
        </label>

        <input
            type="text"
            id="cep"
            name="cep"
            class="input02"
            maxlength="9"
            required
            [(ngModel)]="atleta.cep"
            (input)="formatarCEP()"
            placeholder="00000-000"
        >

        <label for="rua">
            Rua/Logradouro*
        </label>

        <input
            type="text"
            id="rua"
            name="rua"
            class="input01"
            maxlength="100"
            required
            [(ngModel)]="atleta.rua"
            placeholder="Digite a Rua ou o Logradouro"
        >

        <label for="bairro">
            Bairro*
        </label>

        <input
            type="text"
            id="bairro"
            name="bairro"
            class="input02"
            maxlength="60"
            required
            [(ngModel)]="atleta.bairro"
            placeholder="Digite o bairro"
        >

        <label for="cidade">
            Cidade*
        </label>

        <input
            type="text"
            id="cidade"
            name="cidade"
            class="input02"
            maxlength="60"
            required
            [(ngModel)]="atleta.cidade"
            placeholder="Digite a cidade"
        >

        <label for="uf">
            UF
        </label>

        <input
            type="text"
            id="uf"
            name="uf"
            class="input02"
            maxlength="2"
            [(ngModel)]="atleta.uf"
            placeholder="UF"
        >

        <div id="div-btns">

            <button
                type="button"
                id="btnAdd"
                (click)="cadastrarAtleta()"
            >
                Cadastrar
            </button>

            <button
                type="button"
                id="btnLimpar"
                (click)="limpar()"
            >
                Limpar
            </button>

        </div>

    </form>

</section>
