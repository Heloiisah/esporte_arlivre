<div id="div-form">

    <h2>Cadastro de Atleta</h2>

    <form>

        <label for="nome">
            Nome Completo
        </label>

        <input
            type="text"
            id="nome"
            name="nome"
            class="input01"
            [(ngModel)]="atleta.nome"
            placeholder="Digite seu nome completo"
        >

        <label for="cpf">
            CPF
        </label>

        <input
            type="text"
            id="cpf"
            name="cpf"
            class="input02"
            [(ngModel)]="atleta.cpf"
            (input)="formatarCPF()"
            maxlength="14"
            placeholder="000.000.000-00"
        >

        <label>
            Sexo
        </label>

        <input
            type="radio"
            name="sexo"
            value="M"
            [(ngModel)]="atleta.sexo"
        >
        Masculino

        <input
            type="radio"
            name="sexo"
            value="F"
            [(ngModel)]="atleta.sexo"
        >
        Feminino

        <input
            type="radio"
            name="sexo"
            value="N"
            [(ngModel)]="atleta.sexo"
        >
        Não se identificar

        <label for="cep">
            CEP
        </label>

        <input
            type="text"
            id="cep"
            name="cep"
            class="input02"
            [(ngModel)]="atleta.cep"
            (input)="formatarCEP()"
            maxlength="9"
            placeholder="00000-000"
        >

        <label for="rua">
            Rua / Logradouro
        </label>

        <input
            type="text"
            id="rua"
            name="rua"
            class="input01"
            [(ngModel)]="atleta.rua"
            placeholder="Rua / Logradouro"
        >

        <label for="bairro">
            Bairro
        </label>

        <input
            type="text"
            id="bairro"
            name="bairro"
            class="input02"
            [(ngModel)]="atleta.bairro"
            placeholder="Bairro"
        >

        <label for="cidade">
            Cidade
        </label>

        <input
            type="text"
            id="cidade"
            name="cidade"
            class="input02"
            [(ngModel)]="atleta.cidade"
            placeholder="Cidade"
        >

        <label for="uf">
            UF
        </label>

        <input
            type="text"
            id="uf"
            name="uf"
            class="input02"
            maxlength="2"
            [(ngModel)]="atleta.uf"
            placeholder="UF"
        >

        <div id="div-btns">

            <button
                type="button"
                id="btnAdd"
                (click)="cadastrarAtleta()"
            >
                Cadastrar Atleta
            </button>

            <button
                type="button"
                id="btnLimpar"
                (click)="limpar()"
            >
                Limpar
            </button>

        </div>

    </form>

</div>
